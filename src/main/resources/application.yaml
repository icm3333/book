spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/book}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Safe default: the app verifies the schema but never changes it.
    # The dev profile relaxes this to "update" for local work.
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

jwt:
  expiration: ${JWT_EXPIRATION}
  key: ${JWT_KEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

openlibrary:
  base-url: ${OPENLIBRARY_BASE_URL:https://openlibrary.org}
  user-agent: ${OPENLIBRARY_USER_AGENT:BookTracker/0.0.1}
  connect-timeout: 3s
  read-timeout: 5s

springdoc:
  # The API description and Swagger UI are publicly reachable so a frontend team can explore
  # the contract. Set both to false (or SPRINGDOC_ENABLED=false) before exposing this
  # service on an untrusted network.
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
