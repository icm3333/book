<button
  type="button"
  class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-medium focus:text-slate-900 focus:shadow-lg focus:ring-2 focus:ring-brand-500 focus:outline-none"
  (click)="skipToContent()"
>
  Skip to content
</button>

<header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/85 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-6xl items-center gap-2 px-4 sm:gap-6">
    <a
      routerLink="/library"
      class="flex items-center gap-2.5 rounded-lg font-semibold text-slate-900 focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:outline-none"
      aria-label="Book Tracker home"
    >
      <span class="flex size-8 items-center justify-center rounded-lg bg-brand-600 text-white shadow-sm shadow-brand-600/30">
        <app-icon name="book-open" class="size-4" />
      </span>
      <span class="hidden sm:inline">Book Tracker</span>
    </a>

    <nav aria-label="Main" class="flex items-center gap-1">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="nav-link-active" ariaCurrentWhenActive="page" class="nav-link">
          <app-icon [name]="link.icon" class="size-4" />
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="ml-auto flex items-center gap-2">
      @if (auth.username(); as name) {
        <span class="hidden items-center gap-2 text-sm text-slate-600 md:flex">
          <span
            class="flex size-8 items-center justify-center rounded-full bg-slate-100 font-medium text-slate-700"
            aria-hidden="true"
          >
            {{ initial() }}
          </span>
          {{ name }}
        </span>
      }
      <button type="button" class="btn btn-ghost px-3" aria-label="Sign out" (click)="auth.logout()">
        <app-icon name="log-out" class="size-4" />
        <span class="hidden sm:inline">Sign out</span>
      </button>
    </div>
  </div>
</header>

<main #main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl px-4 py-8 focus:outline-none sm:py-10">
  <router-outlet />
</main>
